name: Release
on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Coverage gate (>=70% lines on src/)
        run: CI=1 pnpm exec vitest run
      - name: Dashboard build
        run: pnpm --dir dashboard build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) + provenance — no token secret
      contents: write   # gh release create; with `read` it fails 403 even after a good publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Strip the empty authToken placeholder
        # setup-node writes an empty `//registry.npmjs.org/:_authToken=` line into the
        # userconfig. npm prefers that line over the OIDC exchange and fails with
        # ENEEDAUTH (setup-node#1551). Trusted publishing uses no token, so the line has
        # to go before anything authenticates.
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - name: Publish to npm
        # One real publish. This step is ALLOWED to fail the job: a release that never
        # reached the registry must not look shipped, and the previous two-attempt
        # diagnostic form ended in `true`, which could never fail.
        run: npm publish
      - name: Publish diagnostics (only when the publish above failed)
        if: failure()
        run: |
          echo "=== npm $(npm --version) / node $(node --version)"
          echo "=== minted OIDC claims:"
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          echo "$RESP" | jq -r '.value' | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); c=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:c.get(k) for k in ['iss','aud','repository_owner','repository','workflow','ref','ref_type','event_name','job_workflow_ref']},indent=1))" || true
          echo "=== userconfig:"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(none)"
          echo "=== auth-related lines from the npm debug log:"
          grep -ihE "oidc|id.?token|eneedauth|need auth|trusted" /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | cut -c1-160 | head -40 || true
      - name: GitHub release from the tag
        # Gate on THIS version, not on a literal string. The packument carries every
        # published version, so `grep -q '"0.3.4"'` is true forever once 0.3.4 shipped —
        # it was not a gate at all.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL https://registry.npmjs.org/deepindex | grep -q "\"$VERSION\""
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

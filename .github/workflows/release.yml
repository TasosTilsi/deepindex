name: Release
on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Coverage gate (>=70% lines on src/)
        run: CI=1 pnpm exec vitest run
      - name: Dashboard build
        run: pnpm --dir dashboard build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) + provenance — no token secret
      # contents: read — this job installs dependency scripts; it must not be able to write to the
      # repository. Creating the release is a separate job below, with only the privilege it needs.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install
        # --ignore-scripts: this job holds `id-token: write`, and every approved build script
        # (better-sqlite3, the tree-sitter parsers, onnxruntime-node's GitHub-release download)
        # would otherwise run while that token is mintable. The publish path needs none of them —
        # `prepack` runs tsc, and the grammars ship prebuilt.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Strip the empty authToken placeholder
        # setup-node writes an empty `//registry.npmjs.org/:_authToken=` line into the
        # userconfig. npm prefers that line over the OIDC exchange and fails with
        # ENEEDAUTH (setup-node#1551). Trusted publishing uses no token, so the line has
        # to go before anything authenticates.
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - name: Publish to npm
        # One real publish. This step is ALLOWED to fail the job: a release that never
        # reached the registry must not look shipped, and the previous two-attempt
        # diagnostic form ended in `true`, which could never fail.
        run: npm publish
      - name: Publish diagnostics (only when the publish above failed)
        if: failure()
        run: |
          echo "=== npm $(npm --version) / node $(node --version)"
          echo "=== minted OIDC claims:"
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          echo "$RESP" | jq -r '.value' | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); c=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:c.get(k) for k in ['iss','aud','repository_owner','repository','workflow','ref','ref_type','event_name','job_workflow_ref']},indent=1))" || true
          echo "=== userconfig (redacted):"
          sed -E 's/(_authToken[[:space:]]*=).*/\1<redacted>/' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(none)"
          echo "=== auth-related lines from the npm debug log:"
          grep -ihE "oidc|id.?token|eneedauth|need auth|trusted" /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | cut -c1-160 | head -40 || true
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create, and nothing else
    steps:
      - name: GitHub release from the tag
        # Gate on THIS version as a key of the registry's versions map. The whole packument was
        # searched before, so the literal `"0.3.4"` kept matching forever once 0.3.4 shipped, and
        # a release was cut even when its own publish had failed.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL https://registry.npmjs.org/deepindex | grep -qE "\"$VERSION\"[[:space:]]*:"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

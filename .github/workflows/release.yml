name: Release
on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Coverage gate (>=70% lines on src/)
        run: CI=1 pnpm exec vitest run
      - name: Dashboard build
        run: pnpm --dir dashboard build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing (OIDC) + provenance — no token secret
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Debug OIDC claims
        run: |
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm_registry")
          echo "$RESP" | jq -r '.value' | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); c=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:c.get(k) for k in ['iss','aud','repository_owner','repository','workflow','ref','ref_type','event_name','job_workflow_ref']},indent=1))"
      - name: Publish (npm trusted publishing — OIDC)
        # Mirrors docs.npmjs.com/trusted-publishers example: setup-node@v6 +
        # node 24 (bundled npm >= 11.5.1) + registry-url. id-token: write
        # above drives the OIDC exchange. Verify job keeps node 22 (vitest
        # worker crash on node 24 — bc21dbf); publish runs no vitest.
        run: npm publish
      - name: GitHub release from tag
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
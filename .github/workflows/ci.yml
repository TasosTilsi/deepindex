name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Coverage gate (>=70% lines on src/)
        run: CI=1 pnpm exec vitest run
      - name: Dashboard build
        run: pnpm --dir dashboard build

      - name: Build the published artifact
        run: pnpm build
      - name: Run the published artifact
        # Nothing else in CI executes dist/: the tarball's bin was only ever exercised
        # by a user installing it. tests/packaged-cli.test.ts runs the same file.
        run: |
          node dist/cli.js --version
          node dist/cli.js index fixtures/sample-repo --db /tmp/ci-artifact.db
      - name: Smoke
        run: pnpm run smoke
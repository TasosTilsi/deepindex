packages:
  - '.'
  - 'dashboard'

allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: set this to true or false
  tree-sitter: set this to true or false
  tree-sitter-javascript: set this to true or false
  tree-sitter-typescript: set this to true or false
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - tree-sitter
  - tree-sitter-javascript
  - tree-sitter-typescript
  # DI-01: @huggingface/transformers (optionalDependency) pulls these native
  # prebuilt-binary installers — pnpm 10 gates their build scripts here.
  - onnxruntime-node
  - sharp
